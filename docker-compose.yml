services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fego84}
      POSTGRES_USER: ${POSTGRES_USER:-fego84}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fego84}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py makemigrations accounts content_blocks elections auditlog && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

volumes:
  pgdata:
