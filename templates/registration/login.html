{% extends "base.html" %}
{% block title %}Login · FEGO '84 Election{% endblock %}

{% block content %}
  <div class="card" style="max-width:520px">
    <h2>Login</h2>
    <form method="post">
      {% csrf_token %}
      <label>Username<br><input name="username" autocomplete="username" required></label><br><br>
      <label>Password<br><input type="password" name="password" autocomplete="current-password" required></label><br><br>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
    <p class="muted" style="margin-top:12px">If you cannot login, contact the admin.</p>
  </div>
{% endblock %}

{% block footer %}{% endblock %}
