<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}FEGO '84 Election{% endblock %}</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:0;line-height:1.4}
    header,footer{padding:16px;background:#f3f3f3}
    main{padding:16px;max-width:920px;margin:0 auto}
    .banner{font-size:22px;font-weight:700}
    .scroll{background:#111;color:#fff;padding:8px 12px;margin:12px 0;border-radius:8px}
    .card{border:1px solid #e5e5e5;border-radius:10px;padding:16px;margin:12px 0}
    .btn{display:inline-block;padding:10px 14px;border-radius:8px;border:1px solid #333;text-decoration:none}
    .btn-primary{background:#111;color:#fff}
    .grid{display:grid;gap:12px}
    @media (min-width:700px){.grid{grid-template-columns:1fr 1fr}}
    .muted{color:#555}
    .msg{padding:10px 12px;border-radius:8px;margin:10px 0}
    .msg-error{background:#ffe5e5}
    .msg-success{background:#e8ffe8}
    .msg-info{background:#e8f1ff}
  </style>
</head>
<body>
  <header>
    <div class="banner">FEGO '84 Election Voting Platform</div>
    <div class="muted">
      <a href="/">Home</a> · <a href="/about/">About Us</a>
      {% if user.is_authenticated %} · <a href="/voter/">Member Area</a> · <a href="/accounts/logout/">Logout</a>{% else %} · <a href="/accounts/login/">Login</a>{% endif %}
    </div>
  </header>
  <main>
    {% if messages %}
      {% for message in messages %}
        <div class="msg {% if message.tags %}msg-{{ message.tags }}{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>
  <footer>
    {% block footer %}{% endblock %}
  </footer>
</body>
</html>
