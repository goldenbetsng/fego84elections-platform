services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fego84}
      POSTGRES_USER: ${POSTGRES_USER:-fego84}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    command: ["/app/scripts/entrypoint.sh"]
    volumes:
      # Share collected static files with nginx
      - staticfiles:/static
    expose:
      - "8000"

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/static:ro

volumes:
  pgdata:
  staticfiles:
